<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f4eb8">
  <title>融侨学迹 · 学业质量档案</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/leader.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="leader-sidebar">
    <a href="/" class="leader-brand" aria-label="返回融侨学迹首页">
      <span class="logo-mark"><i></i><i></i><i></i></span>
      <span>融侨学迹<small>学业质量档案</small></span>
    </a>
    <nav id="navigation" aria-label="主导航"></nav>
    <div class="sidebar-bottom">
      <a href="/quick.html" class="sidebar-link"><span>快速一次性出表</span><span aria-hidden="true">↗</span></a>
      <button id="shutdown-button" class="text-button sidebar-shutdown" type="button">关闭本机服务</button>
      <p class="sidebar-meta">数据仅存本机 · 每场考试保留来源与口径</p>
    </div>
  </aside>
  <div class="leader-shell">
    <header class="leader-topbar">
      <div class="topbar-context">
        <span id="breadcrumb" class="sr-only">全校总览</span>
        <div class="topbar-title-group">
          <h1 id="page-title">全校学情总览</h1>
          <p id="page-subtitle" class="topbar-subtitle">各年级独立统计，每个结果都能查看依据。</p>
        </div>
        <div class="exam-toolbar" id="exam-toolbar" hidden>
          <label class="exam-picker">
            <span class="sr-only">当前考试</span>
            <select id="exam-select" aria-label="选择考试"></select>
          </label>
          <span id="scope-description" class="scope-pill"></span>
          <button class="btn quiet small" type="button" data-action="rules">口径设置</button>
        </div>
      </div>
      <div class="topbar-actions">
        <div id="heading-action"></div>
        <button class="btn secondary small" id="present-button" type="button" data-action="presentation">汇报模式</button>
        <button class="btn primary small" type="button" data-action="open-import">导入成绩</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="global-error" class="error" role="alert" hidden></div>
      <div id="view-content" aria-live="polite"></div>
      <footer class="leader-footer">
        <span>融侨学迹 · 学业质量档案</span>
        <span>明细、统计、班情与打印报表共用同一套已确认计算口径</span>
      </footer>
    </main>
  </div>
  <div id="drawer-overlay" class="leader-overlay" hidden>
    <section class="leader-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header>
        <div><small id="drawer-label"></small><h2 id="drawer-title"></h2></div>
        <button class="icon-close" type="button" data-action="close-drawer" aria-label="关闭详情">×</button>
      </header>
      <div id="drawer-content"></div>
    </section>
  </div>
  <script src="/common.js"></script>
  <script src="/leader-charts.js"></script>
  <script src="/leader-brief.js"></script>
  <script src="/leader-rules.js"></script>
  <script src="/leader-s3.js"></script>
  <script src="/leader-multi.js"></script>
  <script src="/leader-cards.js"></script>
  <script src="/leader-levels.js"></script>
  <script src="/leader-print-studio.js"></script>
  <script src="/leader.js"></script>
</body>
</html>
